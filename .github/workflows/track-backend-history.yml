name: Track Backend History

on:
  push:
    branches:
      - dhruvil.backend
    paths-ignore:
      - 'DOCs/Development_History/**'

permissions:
  contents: write

jobs:
  update-history:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Update Backend Work History
        env:
          TARGET_FILE: 'DOCs/Development_History/Backend Work History.md'
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_AUTHOR: ${{ github.actor }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: node .github/scripts/update_history.js

      - name: Commit and Push History Updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(history): auto-update Backend Work History [skip ci]"
          branch: ${{ github.ref_name }}
