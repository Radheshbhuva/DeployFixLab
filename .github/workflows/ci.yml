name: DeployFix Lab CI Suite

on:
  pull_request:
    branches: [main, master-trial.Radhesh, "master(trial)"]
  push:
    branches: [main, master-trial.Radhesh, "master(trial)"]

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Job 1: Frontend — Type-check, Unit tests, and Production build
  # ─────────────────────────────────────────────────────────────────
  validate-frontend:
    name: "Frontend: Type-Check, Tests & Build"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Application/frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Application/frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: TypeScript Type-Check
        run: npm run type-check

      - name: Run Frontend Unit Tests
        run: npm run test

      - name: Production Bundle Verification
        run: npm run build
        env:
          VITE_API_URL: https://deployfix-api.onrender.com/api
          VITE_WS_URL: wss://deployfix-api.onrender.com
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: ci_placeholder_anon_key
          VITE_ENV: production

  # ─────────────────────────────────────────────────────────────────
  # Job 2: Backend — Prisma generate, Type-check, and Unit tests
  # ─────────────────────────────────────────────────────────────────
  validate-backend:
    name: "Backend: Type-Check & Test Suite"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Application/backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Application/backend/package-lock.json

      - name: Install Backend Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:ci@localhost:5432/deployfix_ci
          DIRECT_URL: postgresql://postgres:ci@localhost:5432/deployfix_ci

      - name: TypeScript Type-Check
        run: npm run type-check
        env:
          DATABASE_URL: postgresql://postgres:ci@localhost:5432/deployfix_ci
          DIRECT_URL: postgresql://postgres:ci@localhost:5432/deployfix_ci

      - name: Run Backend Unit Tests
        run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:ci@localhost:5432/deployfix_ci
          DIRECT_URL: postgresql://postgres:ci@localhost:5432/deployfix_ci
          JWT_SECRET: ci_test_jwt_secret_64chars_placeholder_only
          JWT_REFRESH_SECRET: ci_test_jwt_refresh_secret_64chars_placeholder
          CORS_ORIGIN: http://localhost:5173
