name: Deploy to Production (Vercel & Render)

on:
  push:
    branches: [main, master-trial.Radhesh]

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Job 1: Deploy Frontend to Vercel Edge CDN
  # ─────────────────────────────────────────────────────────────────
  deploy-frontend:
    name: "Deploy: Frontend → Vercel"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Application/frontend/package-lock.json

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        working-directory: Application/frontend
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Project Artifacts
        working-directory: Application/frontend
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy Project Artifacts to Vercel
        working-directory: Application/frontend
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ─────────────────────────────────────────────────────────────────
  # Job 2: Trigger Render Backend Deploy via Deploy Hook
  # ─────────────────────────────────────────────────────────────────
  deploy-backend:
    name: "Deploy: Backend → Render"
    runs-on: ubuntu-latest
    needs: deploy-frontend

    steps:
      - name: Trigger Render Deploy Hook
        run: |
          echo "Triggering Render deploy for service ${{ secrets.RENDER_SERVICE_ID }}"
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "Deploy hook triggered successfully."

  # ─────────────────────────────────────────────────────────────────
  # Job 3: Post-Deployment Smoke Verification
  # ─────────────────────────────────────────────────────────────────
  smoke-verify:
    name: "Verify: Production Health Check"
    runs-on: ubuntu-latest
    needs: [deploy-frontend, deploy-backend]

    steps:
      - name: Wait for Render deploy to stabilize
        run: sleep 30

      - name: Probe Backend Healthcheck Endpoint
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://deployfix-api.onrender.com/health)
          echo "Health endpoint returned: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "ERROR: Health check failed with status $HTTP_STATUS"
            exit 1
          fi
          echo "Health check passed."

      - name: Probe Frontend Bundle
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://deployfixlab.vercel.app)
          echo "Frontend returned: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "WARNING: Frontend returned $HTTP_STATUS"
          fi
