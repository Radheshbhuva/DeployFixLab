<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DeployFix Lab — AI-powered production deployment troubleshooting and recovery platform for engineers." />
    <meta name="theme-color" content="#0F172A" />

    <!-- Synchronous Anti-FOIT Theme Resolver -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('deployfix-lab-theme');
          var theme = 'system';
          if (stored) {
            try {
              var parsed = JSON.parse(stored);
              theme = (parsed && parsed.state && parsed.state.theme) || parsed.theme || stored;
            } catch (e) {
              theme = stored;
            }
          }
          var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (err) {}
      })();
    </script>
    
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    
    <title>DeployFix Lab — Engineering Platform</title>
  </head>
  <body class="bg-bg-primary text-text-primary antialiased selection:bg-brand-primary selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
